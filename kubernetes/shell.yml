apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responsible-ai-shell
  template:
    metadata:
      labels:
        app: responsible-ai-shell
    spec:
      containers:
        - name: responsible-ai-shell
          image: ${{ secrets.DOCKER_USERNAME }}/responsible-ai-shell:latest
          ports:
            - containerPort: 8800
---
apiVersion: v1
kind: Service
metadata:
  name: shell-service
spec:
  selector:
    app: responsible-ai-shell
  ports:
    - protocol: TCP
      port: 8800
      targetPort: 8800

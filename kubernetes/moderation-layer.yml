apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-layer-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responsible-ai-moderationlayer
  template:
    metadata:
      labels:
        app: responsible-ai-moderationlayer
    spec:
      containers:
        - name: responsible-ai-moderationlayer
          image: ${{ secrets.DOCKER_USERNAME }}/responsible-ai-moderationlayer:latest
          ports:
            - containerPort: 8400
---
apiVersion: v1
kind: Service
metadata:
  name: moderation-layer-service
spec:
  selector:
    app: responsible-ai-moderationlayer
  ports:
    - protocol: TCP
      port: 8400
      targetPort: 8400

apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responsible-ai-admin
  template:
    metadata:
      labels:
        app: responsible-ai-admin
    spec:
      containers:
        - name: responsible-ai-admin
          image: ${{ secrets.DOCKER_USERNAME }}/responsible-ai-admin:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
spec:
  selector:
    app: responsible-ai-admin
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

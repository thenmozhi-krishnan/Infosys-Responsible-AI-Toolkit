apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfe-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responsible-ai-mfe
  template:
    metadata:
      labels:
        app: responsible-ai-mfe
    spec:
      containers:
        - name: responsible-ai-mfe
          image: ${{ secrets.DOCKER_USERNAME }}/responsible-ai-mfe:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: mfe-service
spec:
  selector:
    app: responsible-ai-mfe
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000

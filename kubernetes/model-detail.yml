apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-detail-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responsible-ai-model-detail
  template:
    metadata:
      labels:
        app: responsible-ai-model-detail
    spec:
      containers:
        - name: responsible-ai-model-detail
          image: ${{ secrets.DOCKER_USERNAME }}/responsible-ai-model-detail:latest
          ports:
            - containerPort: 8300
---
apiVersion: v1
kind: Service
metadata:
  name: model-detail-service
spec:
  selector:
    app: responsible-ai-model-detail
  ports:
    - protocol: TCP
      port: 8300
      targetPort: 8300
